name: aria
description: "Transferencia de archivos entre dispositivos cercanos en la red local."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_foreground_task: ^10.0.0
  flutter_riverpod: ^2.6.1
  nsd: ^5.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter va empaquetada: bajarla en runtime seria trafico fuera de la LAN.
  # Pesos 400/500/600/700, los mismos que importa css/nocturne.css.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
